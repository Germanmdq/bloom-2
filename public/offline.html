<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin Conexión | Bloom Café</title>
  <link rel="icon" href="/icons/favicon-32x32.png">
  <style>
    :root {
      --bg: #14241e;
      --card-bg: #1a3028;
      --gold: #c4b896;
      --gold-light: #f5e8ca;
      --cream: #fffdf8;
      --muted: #a8c9b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(196, 184, 150, 0.2);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(196, 184, 150, 0.12);
      border: 1px solid rgba(196, 184, 150, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }
    .badge-offline {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #ef4444;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-offline::after {
      content: "!";
      color: white;
      font-weight: bold;
      font-size: 11px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn {
      background: var(--gold);
      color: #1a3028;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(196, 184, 150, 0.3);
      width: 100%;
      justify-content: center;
    }
    .btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-wrapper">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gold);">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <div class="badge-offline"></div>
    </div>
    <h1>Sin Conexión</h1>
    <p>No se pudo conectar con el servidor de Bloom Café. Verifica tu conexión Wi-Fi o datos móviles.</p>
    <button class="btn" onclick="retry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Reintentar conexión
    </button>
    <div class="hint">Bloom OS v2.0 • Modo PWA</div>
  </main>
  <script>
    function retry() {
      const btn = document.querySelector('.btn');
      btn.textContent = 'Comprobando...';
      btn.style.opacity = '0.7';
      setTimeout(() => {
        window.location.reload();
      }, 500);
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
